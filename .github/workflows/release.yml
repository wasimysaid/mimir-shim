name: Release Mimir
on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (must match the source)
        required: true
        type: string
      source_ref:
        description: Private Mimir source ref
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-mimir-${{ inputs.version }}
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.source.outputs.version }}
      source: ${{ steps.source.outputs.source }}
    steps:
      - uses: actions/checkout@v5
        with:
          repository: wasimysaid/mimir
          ref: ${{ inputs.source_ref }}
          ssh-key: ${{ secrets.MIMIR_SOURCE_SSH_KEY }}
          persist-credentials: false
      - id: source
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version=${VERSION#v}
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          source=$(git rev-parse HEAD)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "source=$source" >> "$GITHUB_OUTPUT"
  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-24.04
          - platform: windows-x64
            runner: windows-2022
          - platform: darwin-x64
            runner: macos-15-intel
          - platform: darwin-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v5
        with:
          path: shim
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: wasimysaid/mimir
          ref: ${{ needs.prepare.outputs.source }}
          ssh-key: ${{ secrets.MIMIR_SOURCE_SSH_KEY }}
          path: source
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: source
          shared-key: release-${{ matrix.platform }}
      - name: Linux static target
        if: matrix.platform == 'linux-x64'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          rustup target add x86_64-unknown-linux-musl
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build verified binary and skill archive
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          sh -n shim/install.sh
          python shim/scripts/build-release.py --source-dir source --out release-assets --platform "$PLATFORM" --version "$VERSION"
      - uses: actions/upload-artifact@v5
        with:
          name: mimir-${{ matrix.platform }}
          path: release-assets/mimir-*.*
          retention-days: 7
  stage:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.prepare.outputs.version }}
      SOURCE_REF: ${{ needs.prepare.outputs.source }}
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: mimir-*
          path: release-assets
          merge-multiple: true
      - name: Publish candidate for real download verification
        working-directory: release-assets
        run: |
          set -euo pipefail
          assets=(mimir-linux-x64.tar.gz mimir-windows-x64.zip mimir-darwin-x64.tar.gz mimir-darwin-arm64.tar.gz)
          for asset in "${assets[@]}"; do test -f "$asset"; done
          sha256sum "${assets[@]}" > SHA256SUMS
          sha256sum -c SHA256SUMS
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo 'Release already exists; refusing to overwrite its assets.' >&2
            exit 1
          fi
          printf 'Mimir %s\n\nSource commit: `%s`.\n\nEach archive includes the configure-mimir skill and all references. Native install verification is pending.\n' "$VERSION" "$SOURCE_REF" > notes.md
          gh release create "v$VERSION" --prerelease --title "v$VERSION" --notes-file notes.md "${assets[@]}" SHA256SUMS
  install:
    needs: [prepare, stage]
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, windows-2022, macos-15-intel, macos-15]
    runs-on: ${{ matrix.runner }}
    env:
      MIMIR_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Real curl installation and same-version repair
        shell: bash
        run: |
          set -euo pipefail
          test_temp="$RUNNER_TEMP"
          if command -v cygpath >/dev/null 2>&1; then test_temp=$(cygpath -u "$test_temp"); fi
          export MIMIR_INSTALL_DIR="$test_temp/Mimir install café"
          curl -fsSL https://mimir.kernelvm.xyz/install.sh | sh
          "$MIMIR_INSTALL_DIR/mimir" --version
          python tests/skill.py "$MIMIR_INSTALL_DIR/mimir${{ runner.os == 'Windows' && '.exe' || '' }}"
          test -f "$HOME/.agents/skills/configure-mimir/references/settings-and-precedence.md"
          rm "$HOME/.agents/skills/configure-mimir/references/settings-and-precedence.md"
          curl -fsSL https://mimir.kernelvm.xyz/install.sh | sh
          test -f "$HOME/.agents/skills/configure-mimir/references/settings-and-precedence.md"
      - name: Native PowerShell 5.1 installation
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $env:MIMIR_INSTALL_DIR = Join-Path $env:RUNNER_TEMP 'Mimir PowerShell café'
          irm https://mimir.kernelvm.xyz/install.ps1 | iex
          & (Join-Path $env:MIMIR_INSTALL_DIR 'mimir.exe') --version
          if ($LASTEXITCODE -ne 0) { throw 'Installed executable failed' }
          if (-not (Test-Path "$env:USERPROFILE\.agents\skills\configure-mimir\SKILL.md")) { throw 'Skill missing' }
      - name: Native PowerShell 7 reinstall
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:MIMIR_INSTALL_DIR = Join-Path $env:RUNNER_TEMP 'Mimir PowerShell café'
          irm https://mimir.kernelvm.xyz/install.ps1 | iex
          & (Join-Path $env:MIMIR_INSTALL_DIR 'mimir.exe') --version
          if ($LASTEXITCODE -ne 0) { throw 'Installed executable failed' }
  publish:
    needs: [prepare, install]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.prepare.outputs.version }}
      SOURCE_REF: ${{ needs.prepare.outputs.source }}
    steps:
      - run: |
          set -euo pipefail
          printf 'Mimir %s\n\nSource commit: `%s`.\n\nNative installation verified on Linux x64, Windows x64, macOS Intel and Apple Silicon. Each archive includes configure-mimir and its references. Verify downloads with SHA256SUMS.\n' "$VERSION" "$SOURCE_REF" > notes.md
          gh release edit "v$VERSION" --prerelease=false --latest --notes-file notes.md
